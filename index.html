<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Türk | Sohbet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="discord-icon.png" type="image/png">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sol Sütun -->
        <div class="left-sidebar">
            <div class="server-list">
                <div class="server-item active" onclick="showDirectMessages()">
                    <img src="default-avatar.png" alt="DM">
                </div>
                <div class="server-item" onclick="showServer('genel')">
                    <img src="default-avatar.png" alt="Genel">
                </div>
                <div class="add-server" onclick="createServer()">
                    <i class="fas fa-plus"></i>
                </div>
            </div>
            
            <div class="user-panel">
                <div class="user-avatar" onclick="openProfileModal()">
                    <img id="userAvatar" src="default-avatar.png" alt="Profil">
                    <span class="status-indicator online" id="userStatus"></span>
                </div>
            </div>
        </div>
        
        <!-- Orta Sütun -->
        <div class="middle-sidebar">
            <div class="friends-header">
                <h3><i class="fas fa-comment-alt"></i> Özel Mesajlar</h3>
                <button class="icon-btn" onclick="toggleAddFriend()">
                    <i class="fas fa-user-plus"></i>
                </button>
            </div>
            
            <div class="add-friend-box" id="addFriendBox" style="display: none;">
                <input type="text" id="friendUsername" placeholder="Kullanıcı adı girin">
                <button onclick="sendFriendRequest()">İstek Gönder</button>
            </div>
            
            <div class="friends-list" id="friendsList">
                <!-- Arkadaşlar buraya gelecek -->
            </div>
            
            <div class="friend-requests" id="friendRequests" style="display: none;">
                <h4>Arkadaşlık İstekleri</h4>
                <div id="requestsContainer"></div>
            </div>
        </div>
        
        <!-- Ana Sohbet Alanı -->
        <div class="main-chat">
            <div class="chat-header">
                <div class="chat-info">
                    <div class="chat-avatar">
                        <img id="chatAvatar" src="default-avatar.png" alt="Avatar">
                        <span class="status-indicator" id="chatStatus"></span>
                    </div>
                    <div>
                        <h3 id="chatWith">Sohbet Seçin</h3>
                        <p id="chatStatusText">Bir arkadaş seçerek sohbete başlayın</p>
                    </div>
                </div>
                <div class="chat-actions">
                    <button class="icon-btn" onclick="toggleFriendRequests()">
                        <i class="fas fa-user-friends"></i>
                        <span class="badge" id="requestCount">0</span>
                    </button>
                    <button class="icon-btn" onclick="openProfileModal()">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-screen">
                    <img src="discord-icon.png" alt="Discord Türk" class="welcome-logo">
                    <h2>Discord Türk'e Hoş Geldiniz!</h2>
                    <p>Arkadaşlarınızla anında mesajlaşın</p>
                </div>
            </div>
            
            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." disabled>
                <button id="sendButton" onclick="sendMessage()" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Profil Modal -->
    <div class="modal" id="profileModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Profil Düzenle</h3>
                <button onclick="closeProfileModal()" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="avatar-edit">
                    <img id="editAvatar" src="default-avatar.png" alt="Profil">
                    <button onclick="changeAvatar()">Avatar Değiştir</button>
                </div>
                <div class="form-group">
                    <label>Durum</label>
                    <input type="text" id="editStatus" placeholder="Durumunuz">
                </div>
                <div class="form-group">
                    <label>Hakkımda</label>
                    <textarea id="editBio" placeholder="Kendinizden bahsedin"></textarea>
                </div>
                <button onclick="saveProfile()" class="save-btn">Kaydet</button>
            </div>
        </div>
    </div>
    
    <!-- Bildirimler -->
    <div class="notifications" id="notifications"></div>
    
    <script>
        let socket = null;
        let currentUser = null;
        let currentChat = null;
        let token = localStorage.getItem('token');
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!token) window.location.href = '/login';
            else initApp();
        });
        
        function initApp() {
            socket = io();
            
            socket.on('connect', () => {
                socket.emit('kimlik_dogrulama', token);
            });
            
            socket.on('kimlik_dogrulandi', (data) => {
                if (data.basarili) {
                    currentUser = data.kullaniciAdi;
                    loadUserProfile();
                    loadFriends();
                    loadFriendRequests();
                    updateUI();
                } else {
                    localStorage.clear();
                    window.location.href = '/login';
                }
            });
            
            socket.on('yeni_mesaj', (mesaj) => {
                if (currentChat === mesaj.gonderen) {
                    displayMessage(mesaj);
                }
                showNotification(`${mesaj.gonderen}: ${mesaj.mesaj.substring(0, 30)}...`);
            });
            
            socket.on('yeni_arkadas_istegi', (istek) => {
                showNotification(`${istek.gonderen} arkadaşlık isteği gönderdi!`);
                loadFriendRequests();
            });
            
            socket.on('arkadas_istegi_kabul_edildi', (data) => {
                showNotification(`${data.kabulEden} arkadaşlık isteğinizi kabul etti!`);
                loadFriends();
            });
            
            socket.on('arkadas_listesi', (arkadaslar) => {
                renderFriendsList(arkadaslar);
            });
            
            socket.on('mesaj_gecmisi', (mesajlar) => {
                renderChatHistory(mesajlar);
            });
            
            socket.on('arkadas_durumu_degisti', (data) => {
                updateFriendStatus(data.kullaniciAdi, data.online);
            });
            
            socket.on('profil_guncellendi', (data) => {
                if (data.kullaniciAdi === currentUser) {
                    document.getElementById('userAvatar').src = data.profil.avatar;
                    document.getElementById('editAvatar').src = data.profil.avatar;
                }
            });
        }
        
        function loadUserProfile() {
            fetch(`/api/profil/${currentUser}`)
                .then(r => r.json())
                .then(data => {
                    if (data.basarili) {
                        document.getElementById('userAvatar').src = data.profil.avatar;
                        document.getElementById('editAvatar').src = data.profil.avatar;
                        document.getElementById('editStatus').value = data.profil.durum || '';
                        document.getElementById('editBio').value = data.profil.bio || '';
                    }
                });
        }
        
        function loadFriends() {
            socket.emit('arkadas_listesi_iste');
        }
        
        function loadFriendRequests() {
            fetch(`/api/arkadas/istekler/${token}`)
                .then(r => r.json())
                .then(data => {
                    if (data.basarili) {
                        const count = data.istekler.length;
                        document.getElementById('requestCount').textContent = count;
                        renderFriendRequests(data.istekler);
                    }
                });
        }
        
        function renderFriendsList(arkadaslar) {
            const container = document.getElementById('friendsList');
            container.innerHTML = '';
            
            const online = arkadaslar.filter(f => f.online);
            const offline = arkadaslar.filter(f => !f.online);
            
            if (online.length > 0) {
                container.innerHTML += '<div class="category">ÇEVRİMİÇİ</div>';
                online.forEach(friend => {
                    container.innerHTML += createFriendHTML(friend);
                });
            }
            
            if (offline.length > 0) {
                container.innerHTML += '<div class="category">ÇEVRİMDIŞI</div>';
                offline.forEach(friend => {
                    container.innerHTML += createFriendHTML(friend);
                });
            }
        }
        
        function createFriendHTML(friend) {
            return `
                <div class="friend-item" onclick="startChat('${friend.kullaniciAdi}')">
                    <div class="friend-avatar">
                        <img src="${friend.profil.avatar}" alt="${friend.kullaniciAdi}">
                        <span class="status-indicator ${friend.online ? 'online' : 'offline'}"></span>
                    </div>
                    <div class="friend-info">
                        <span class="friend-name">${friend.kullaniciAdi}</span>
                        <span class="friend-status">${friend.profil.durum || ''}</span>
                    </div>
                </div>
            `;
        }
        
        function renderFriendRequests(istekler) {
            const container = document.getElementById('requestsContainer');
            container.innerHTML = '';
            
            istekler.forEach(istek => {
                container.innerHTML += `
                    <div class="request-item">
                        <img src="${istek.profil.avatar}" alt="${istek.kullaniciAdi}">
                        <span>${istek.kullaniciAdi}</span>
                        <div>
                            <button onclick="acceptRequest('${istek.kullaniciAdi}')">✓</button>
                            <button onclick="declineRequest('${istek.kullaniciAdi}')">✗</button>
                        </div>
                    </div>
                `;
            });
        }
        
        function startChat(username) {
            currentChat = username;
            
            document.getElementById('chatWith').textContent = username;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
            
            const friend = getFriendInfo(username);
            if (friend) {
                document.getElementById('chatAvatar').src = friend.profil.avatar;
                document.getElementById('chatStatus').className = `status-indicator ${friend.online ? 'online' : 'offline'}`;
                document.getElementById('chatStatusText').textContent = friend.profil.durum || (friend.online ? 'Çevrimiçi' : 'Çevrimdışı');
            }
            
            socket.emit('mesaj_gecmisi_iste', username);
            document.querySelector('.welcome-screen').style.display = 'none';
        }
        
        function getFriendInfo(username) {
            // Arkadaş bilgisini bul
            return null; // Basit implementasyon
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message && currentChat) {
                socket.emit('mesaj_gonder', {
                    alici: currentChat,
                    mesaj: message
                });
                input.value = '';
                input.focus();
            }
        }
        
        function displayMessage(mesaj) {
            const container = document.getElementById('messagesContainer');
            const isOwn = mesaj.gonderen === currentUser;
            
            const messageHTML = `
                <div class="message ${isOwn ? 'own' : 'other'}">
                    <img src="${mesaj.gonderenProfil.avatar}" alt="${mesaj.gonderen}">
                    <div class="message-content">
                        <div class="message-header">
                            <strong>${mesaj.gonderen}</strong>
                            <small>${new Date(mesaj.tarih).toLocaleTimeString()}</small>
                        </div>
                        <div class="message-text">${mesaj.mesaj}</div>
                    </div>
                </div>
            `;
            
            container.innerHTML += messageHTML;
            container.scrollTop = container.scrollHeight;
        }
        
        function renderChatHistory(mesajlar) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            mesajlar.forEach(mesaj => displayMessage(mesaj));
        }
        
        function sendFriendRequest() {
            const username = document.getElementById('friendUsername').value.trim();
            if (!username) return;
            
            fetch('/api/arkadas/istek/gonder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, hedefKullanici: username })
            })
            .then(r => r.json())
            .then(data => {
                if (data.basarili) {
                    showNotification('İstek gönderildi!');
                    document.getElementById('friendUsername').value = '';
                    toggleAddFriend();
                } else {
                    showNotification(data.hata, 'error');
                }
            });
        }
        
        function acceptRequest(username) {
            fetch('/api/arkadas/istek/kabul', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, gonderen: username })
            })
            .then(r => r.json())
            .then(data => {
                if (data.basarili) {
                    showNotification('Arkadaş eklendi!');
                    loadFriends();
                    loadFriendRequests();
                }
            });
        }
        
        function declineRequest(username) {
            // Basit implementasyon
            loadFriendRequests();
        }
        
        function saveProfile() {
            const status = document.getElementById('editStatus').value;
            const bio = document.getElementById('editBio').value;
            
            fetch('/api/profil/guncelle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, durum: status, bio })
            })
            .then(r => r.json())
            .then(data => {
                if (data.basarili) {
                    showNotification('Profil güncellendi!');
                    closeProfileModal();
                }
            });
        }
        
        function changeAvatar() {
            // Basit implementasyon - varsayılan avatar
            document.getElementById('editAvatar').src = 'default-avatar.png';
        }
        
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notifications');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <span>${message}</span>
                <button onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
        
        function toggleAddFriend() {
            const box = document.getElementById('addFriendBox');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }
        
        function toggleFriendRequests() {
            const requests = document.getElementById('friendRequests');
            requests.style.display = requests.style.display === 'none' ? 'block' : 'none';
        }
        
        function openProfileModal() {
            document.getElementById('profileModal').style.display = 'block';
        }
        
        function closeProfileModal() {
            document.getElementById('profileModal').style.display = 'none';
        }
        
        function createServer() {
            showNotification('Sunucu oluşturma özelliği yakında!');
        }
        
        function showDirectMessages() {
            document.querySelector('.middle-sidebar').style.display = 'block';
        }
        
        function showServer(server) {
            showNotification(`${server} sunucusu açılıyor...`);
        }
        
        function updateUI() {
            document.title = `Discord Türk | ${currentUser}`;
        }
        
        function updateFriendStatus(username, online) {
            const items = document.querySelectorAll(`.friend-item`);
            items.forEach(item => {
                if (item.querySelector('.friend-name')?.textContent === username) {
                    const indicator = item.querySelector('.status-indicator');
                    if (indicator) indicator.className = `status-indicator ${online ? 'online' : 'offline'}`;
                }
            });
        }
    </script>
</body>
    </html>

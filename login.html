<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Türk | Giriş Yap</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="discord-icon.png" type="image/png">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('background.png') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        
        .login-container {
            background: rgba(54, 57, 63, 0.95);
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        
        .logo {
            width: 100px;
            margin-bottom: 20px;
        }
        
        .login-form input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #202225;
            border: 1px solid #202225;
            border-radius: 5px;
            color: white;
            font-size: 16px;
        }
        
        .login-form input:focus {
            outline: none;
            border-color: #7289da;
        }
        
        .login-form button {
            width: 100%;
            padding: 15px;
            background: #7289da;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .login-form button:hover {
            background: #677bc4;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #202225;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            cursor: pointer;
            color: #b9bbbe;
            font-weight: bold;
        }
        
        .tab.active {
            color: white;
            border-bottom: 3px solid #7289da;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="discord-icon.png" alt="Discord Türk" class="logo">
        <h1>Discord Türk</h1>
        <p>Arkadaşlarınızla anında mesajlaşın</p>
        
        <div class="tabs">
            <div class="tab active" onclick="showTab('login')">Giriş Yap</div>
            <div class="tab" onclick="showTab('register')">Kayıt Ol</div>
        </div>
        
        <div id="loginForm" class="login-form">
            <input type="text" id="loginUsername" placeholder="Kullanıcı Adı">
            <input type="password" id="loginPassword" placeholder="Şifre">
            <button onclick="login()">Giriş Yap</button>
            <div id="loginError" class="error"></div>
        </div>
        
        <div id="registerForm" class="login-form" style="display: none;">
            <input type="text" id="registerUsername" placeholder="Kullanıcı Adı">
            <input type="password" id="registerPassword" placeholder="Şifre">
            <input type="password" id="registerPassword2" placeholder="Şifre Tekrar">
            <button onclick="register()">Hesap Oluştur</button>
            <div id="registerError" class="error"></div>
        </div>
    </div>
    
    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            
            if (tab === 'login') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('loginForm').style.display = 'block';
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('registerForm').style.display = 'block';
            }
        }
        
        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            errorDiv.textContent = '';
            
            if (!username || !password) {
                errorDiv.textContent = 'Lütfen tüm alanları doldurun';
                return;
            }
            
            try {
                const response = await fetch('/api/giris', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kullaniciAdi: username, sifre: password })
                });
                
                const data = await response.json();
                
                if (data.basarili) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.kullaniciAdi);
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.hata;
                }
            } catch (error) {
                errorDiv.textContent = 'Sunucu hatası';
            }
        }
        
        async function register() {
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const password2 = document.getElementById('registerPassword2').value;
            const errorDiv = document.getElementById('registerError');
            
            errorDiv.textContent = '';
            
            if (!username || !password) {
                errorDiv.textContent = 'Lütfen tüm alanları doldurun';
                return;
            }
            
            if (password !== password2) {
                errorDiv.textContent = 'Şifreler eşleşmiyor';
                return;
            }
            
            if (username.length < 3) {
                errorDiv.textContent = 'Kullanıcı adı en az 3 karakter olmalı';
                return;
            }
            
            if (password.length < 4) {
                errorDiv.textContent = 'Şifre en az 4 karakter olmalı';
                return;
            }
            
            try {
                const response = await fetch('/api/kayit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kullaniciAdi: username, sifre: password })
                });
                
                const data = await response.json();
                
                if (data.basarili) {
                    alert('Kayıt başarılı! Giriş yapabilirsiniz.');
                    showTab('login');
                    document.getElementById('loginUsername').value = username;
                } else {
                    errorDiv.textContent = data.hata;
                }
            } catch (error) {
                errorDiv.textContent = 'Sunucu hatası';
            }
        }
        
        // Enter tuşu desteği
        document.getElementById('loginPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
        
        document.getElementById('registerPassword2').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') register();
        });
    </script>
</body>
</html>

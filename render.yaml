services:
  - type: web
    name: discord-turk
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_GIZLI_ANAHTAR
        generateValue: true
      - key: NODE_ENV
        value: production
    autoDeploy: true
    domains:
      - discord-turk.onrender.com
